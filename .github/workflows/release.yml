name: Release

# Build desktop bundles for Windows, macOS and Linux and publish a
# GitHub Release with only the DeployTools* installers attached.
#
# Triggers:
#   - push a tag like `v0.1.0`  -> builds + creates/updates the release
#   - manual run (workflow_dispatch) -> builds only (no release upload)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Allow the action to create releases / upload assets.
permissions:
  contents: write

# A new push to the same tag cancels an older, still-running build for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Apple Silicon + Intel in one .dmg)
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin"
          # Windows x64 (.msi + NSIS .exe)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Linux x64 (.AppImage + .deb + .rpm). Build on the OLDEST
          # supported Ubuntu so the AppImage's glibc requirement stays
          # broad (a 24.04 build won't run on older distros).
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both arch targets installed.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # No Rust cache on release: a clean build avoids stale bundles from
      # a previous productName lingering in target/ and confusing
      # tauri-action ("No artifacts were found").

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        run: npm run tauri -- build ${{ matrix.args }}

      # tauri-action's own artifact detection breaks here because Tauri v2
      # emits Linux bundles under BOTH the productName (DeployTools_*) and
      # the Cargo crate name (deploy-tools_*). We upload only the
      # DeployTools* bundles ourselves, which is deterministic.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "DeployTools ${{ github.ref_name }}"
          body: "Download the installer for your OS below. The app is not code-signed yet — on Windows click **More info → Run anyway**; on macOS run `xattr -cr /Applications/DeployTools.app` if it won't open."
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/DeployTools_*-setup.exe
            src-tauri/target/release/bundle/msi/DeployTools_*.msi
            src-tauri/target/release/bundle/appimage/DeployTools_*.AppImage
            src-tauri/target/release/bundle/deb/DeployTools_*.deb
            src-tauri/target/release/bundle/rpm/DeployTools-*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/DeployTools_*.dmg
