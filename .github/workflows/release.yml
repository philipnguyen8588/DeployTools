name: Release

# Build desktop bundles for Windows, macOS and Linux and publish a
# GitHub Release with only the DeployTools* installers attached.
#
# The release is created ONCE by a dedicated job, then each platform's
# build job uploads its own (uniquely-named) assets to it — so the three
# jobs never race to create/update the release at the same time.
#
# Trigger: push a tag like `v0.1.0`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# A new push to the same tag cancels an older, still-running build for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Create / ensure the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "DeployTools ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            Download the installer for your OS below.

            The app is not code-signed yet, so the OS will warn on first launch:
            - **Windows:** on the SmartScreen popup click **More info → Run anyway**.
            - **macOS:** if it won't open, run `xattr -cr "/Applications/DeployTools.app"` (or right-click the app → **Open**).

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Apple Silicon + Intel in one .dmg)
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Windows x64 (.msi + NSIS .exe)
          - platform: windows-latest
            args: ""
          # Linux x64 (.AppImage + .deb + .rpm). Build on the OLDEST
          # supported Ubuntu so the AppImage's glibc requirement stays
          # broad (a 24.04 build won't run on older distros).
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both arch targets installed.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app
        run: npm run tauri -- build ${{ matrix.args }}

      # Upload only the DeployTools* bundles with the GitHub CLI (reliable
      # + fully under our control). Tauri v2 also emits Linux bundles under
      # the crate name deploy-tools_*, which the globs skip. `--clobber`
      # overwrites an asset if it already exists on the release.
      - name: Upload assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/DeployTools_*-setup.exe
            src-tauri/target/release/bundle/msi/DeployTools_*.msi
            src-tauri/target/release/bundle/appimage/DeployTools_*.AppImage
            src-tauri/target/release/bundle/deb/DeployTools_*.deb
            src-tauri/target/release/bundle/rpm/DeployTools-*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/DeployTools_*.dmg
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No DeployTools* artifacts found"; find src-tauri/target -name 'bundle' -type d -exec ls -R {} +; exit 1
          fi
          printf 'Uploading:\n'; printf '  %s\n' "${files[@]}"
          gh release upload "${{ github.ref_name }}" "${files[@]}" \
            --repo "${{ github.repository }}" --clobber
