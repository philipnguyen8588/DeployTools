[package]
name = "deploy-tools"
version = "0.1.0"
description = "Desktop tool to deploy web apps from local to server via SSH"
authors = ["DeployTools"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "deploy_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.0.3"
tauri-plugin-fs = "2.0.3"

# Async runtime.
#
# We used to pull `features = ["full"]` which is ~20+ optional modules.
# Narrow to the ones we actually reference: the multi-thread scheduler,
# `#[tokio::main]` + `select!` macros, timers, filesystem + process
# spawning for rsync, networking, sync primitives, and I/O helpers.
tokio = { version = "1.41", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "net",
    "io-util",
    "process",
] }
futures = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["io"] }
async-trait = "0.1"

# SSH / SFTP (pure Rust, no OpenSSL)
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2.0"

# Cryptography for vault
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Glob matching for exclude paths
globset = "0.4"

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Utils
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.20"
dashmap = "6.1"
sha2 = "0.10"
bytes = "1.8"
dirs = "5.0"
similar = "2.6"
git2 = { version = "0.19", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde_yaml = "0.9"
suppaftp = { version = "6", features = ["async"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3.13"
tokio = { version = "1.41", features = ["full", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "z"
strip = true
debug = false
split-debuginfo = "off"

[profile.dev]
incremental = true
